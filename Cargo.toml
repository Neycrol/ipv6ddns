[package]
name = "ipv6ddns"
version = "1.0.0"
edition = "2021"
rust-version = "1.70.0"
description = "Event-driven IPv6 DDNS client for Cloudflare"
authors = ["Neycrol <neycrol@users.noreply.github.com>"]
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["rt", "net", "time", "macros", "signal", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
async-trait = "0.1"
urlencoding = "2.1"
zeroize = { version = "1.8", features = ["serde", "zeroize_derive"] }

[dev-dependencies]
serial_test = "3.0"
tempfile = "3.10"

[profile.coverage]
inherits = "dev"
opt-level = 0
overflow-checks = false
incremental = false
codegen-units = 1
rpath = false

[profile.bench]
inherits = "release"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[package.metadata.deb]
maintainer = "Neycrol <neycrol@users.noreply.github.com>"
license-file = ["LICENSE", "4"]
assets = [
  ["target/release/ipv6ddns", "usr/bin/ipv6ddns", "755"],
  ["etc/ipv6ddns.service", "lib/systemd/system/ipv6ddns.service", "644"],
  ["etc/config.toml", "etc/ipv6ddns/config.toml", "644"],
  ["README.md", "usr/share/doc/ipv6ddns/README.md", "644"],
]
