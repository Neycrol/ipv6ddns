[package]
name = "ipv6ddns"
version = "1.0.0"
edition = "2021"
rust-version = "1.70.0"
description = "Event-driven IPv6 DDNS client for Cloudflare"
authors = ["Neycrol <neycrol@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/Neycrol/ipv6ddns"
homepage = "https://github.com/Neycrol/ipv6ddns"
documentation = "https://github.com/Neycrol/ipv6ddns#readme"
readme = "README.md"
keywords = ["ipv6", "ddns", "cloudflare", "dns", "dynamic-dns"]
categories = ["network-programming", "command-line-utilities"]
exclude = [".github/", "scripts/", "packaging/", "android/"]

[dependencies]
tokio = { version = "1.35", features = ["rt", "rt-multi-thread", "net", "time", "macros", "signal", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
async-trait = "0.1"
urlencoding = "2.1"
zeroize = { version = "1.8", features = ["serde", "zeroize_derive"] }

[dev-dependencies]
serial_test = "3.0"
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

# Benchmark configuration
[[bench]]
name = "ipv6_validation"
harness = false

[lib]
name = "ipv6ddns"
path = "src/lib.rs"

# Benchmark profile for consistent performance testing
[profile.bench]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.deb]
maintainer = "Neycrol <neycrol@users.noreply.github.com>"
license-file = ["LICENSE", "4"]
assets = [
  ["target/release/ipv6ddns", "usr/bin/ipv6ddns", "755"],
  ["etc/ipv6ddns.service", "lib/systemd/system/ipv6ddns.service", "644"],
  ["etc/config.toml", "etc/ipv6ddns/config.toml", "644"],
  ["README.md", "usr/share/doc/ipv6ddns/README.md", "644"],
]
